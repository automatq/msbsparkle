services:
  postgres:
    image: postgres:16-alpine
    container_name: msbsparkle-postgres
    environment:
      POSTGRES_USER: sparkle
      POSTGRES_PASSWORD: sparkle
      POSTGRES_DB: sparkle
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sparkle -d sparkle"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: msbsparkle-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres-data:
