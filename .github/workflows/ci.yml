name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sparkle
          POSTGRES_PASSWORD: sparkle
          POSTGRES_DB: sparkle
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sparkle"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      mailpit:
        image: axllent/mailpit:latest
        ports: ["1025:1025", "8025:8025"]
    env:
      DATABASE_URL: postgresql://sparkle:sparkle@localhost:5432/sparkle?schema=public
      SHADOW_DATABASE_URL: postgresql://sparkle:sparkle@localhost:5432/sparkle_shadow
      AUTH_SECRET: ci-secret-not-for-production
      AUTH_URL: http://localhost:3000
      AUTH_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      EMAIL_FROM: "CI <ci@example.com>"
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      CRON_SECRET: ci-cron-secret
      CHARGE_GRACE_MINUTES: "0"
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      SEED_ADMIN_EMAIL: admin@msbsparkle.local
      SEED_ADMIN_PASSWORD: admin12345!
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm prisma validate
      - name: Create shadow database for the drift check
        run: node -e "const{Client}=require('pg');const c=new Client({connectionString:process.env.DATABASE_URL});c.connect().then(()=>c.query('create database sparkle_shadow')).then(()=>c.end())"
      - name: Schema drift check (migrations must reproduce schema.prisma)
        run: pnpm prisma migrate diff --from-migrations ./prisma/migrations --to-schema ./prisma/schema.prisma --exit-code
      - run: pnpm prisma migrate deploy
      - run: pnpm db:seed
      - run: pnpm test
      - run: pnpm build
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
